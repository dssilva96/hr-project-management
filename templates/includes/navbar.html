<nav class="topbar navbar navbar-expand bg-white border-bottom">
    <div class="container-fluid px-3 px-lg-4">
        <button class="btn btn-icon d-lg-none" type="button" data-sidebar-toggle aria-label="Open sidebar" aria-controls="appSidebar">
            <i class="bi bi-list"></i>
        </button>

        <div class="topbar-search d-none d-md-flex align-items-center">
            <i class="bi bi-search text-secondary"></i>
            <input type="search" class="form-control" placeholder="Search projects, tasks, or teams" aria-label="Search">
        </div>

        <div class="ms-auto d-flex align-items-center gap-2">
            <button class="btn btn-icon position-relative" type="button" aria-label="Notifications">
                <i class="bi bi-bell"></i>
                <span class="notification-dot"></span>
            </button>

            <div class="dropdown">
                <button class="btn profile-button dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="avatar">
                        {% if request.user.is_authenticated %}
                            {{ request.user.get_username|first|upper }}
                        {% else %}
                            U
                        {% endif %}
                    </span>
                    <span class="d-none d-sm-inline">
                        {% if request.user.is_authenticated %}
                            {{ request.user.get_username }}
                        {% else %}
                            User
                        {% endif %}
                    </span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                    {% if request.user.is_authenticated %}
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form method="post" action="{% url 'accounts:logout' %}">
                                {% csrf_token %}
                                <button class="dropdown-item text-danger" type="submit">
                                    <i class="bi bi-box-arrow-right me-2"></i>Sign out
                                </button>
                            </form>
                        </li>
                    {% else %}
                        <li>
                            <a class="dropdown-item" href="{% url 'accounts:login' %}">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
                            </a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </div>
</nav>
